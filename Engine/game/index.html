<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tap to Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Russo+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
.play-btn-wrap{
  cursor:pointer;
  touch-action:manipulation;
}
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #splash {
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      position: relative;

      /* === BACKGROUND IMAGE === */
      background-image: url('background.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Ripple effect saat di-tap */
    #splash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background 0.15s ease;
      pointer-events: none;
    }

    #splash.tapped::after {
      background: rgba(255, 255, 255, 0.18);
    }

    /* ===== NINJA PLAY BUTTON ===== */
    .play-btn-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: floatIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    /* Glow ring behind button */
    .play-btn-wrap::before {
      content: '';
      position: absolute;
      width: 140%;
      height: 220%;
      background: radial-gradient(ellipse at center,
        rgba(255, 120, 0, 0.35) 0%,
        rgba(255, 50, 0, 0.15) 45%,
        transparent 70%);
      animation: glowPulse 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .play-btn {
      position: relative;
      z-index: 1;
      font-family: 'Russo One', 'Impact', sans-serif;
      font-size: clamp(52px, 14vw, 96px);
      font-style: italic;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      padding: 0.05em 0.45em 0.1em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;

      /* Layered text shadow: outline hitam + api oranye-merah */
      text-shadow:
        0 0 0 #ffffff,
        -3px -3px 0 #1a0500,
         3px -3px 0 #1a0500,
        -3px  3px 0 #1a0500,
         3px  3px 0 #1a0500,
        0 0 12px  #ff6600,
        0 0 28px  #ff4400,
        0 0 55px  #ff2200,
        0 0 90px  rgba(255,80,0,0.55);

      /* Red-to-orange gradient fill */
      background: linear-gradient(
        180deg,
        #ffffff  0%,
        #ffe066 20%,
        #ff8800 50%,
        #cc2200 80%,
        #7a0000 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      /* The "V-diagonal slash" skew like VERSUS logo */
      display: block;
      filter: drop-shadow(0 4px 18px rgba(255,60,0,0.7));
      animation: flamePulse 1.8s ease-in-out infinite;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .play-btn:active {
      transform: scale(0.93);
      filter: drop-shadow(0 2px 32px rgba(255,100,0,1));
    }

    /* Decorative kunai lines above & below */
    .deco-line {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .deco-line span {
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff6600, transparent);
      box-shadow: 0 0 6px #ff4400;
    }

    .deco-line i {
      font-style: normal;
      font-size: clamp(10px, 2.5vw, 14px);
      color: #ffbb44;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-family: 'Russo One', sans-serif;
      text-shadow: 0 0 8px #ff6600;
      white-space: nowrap;
    }

    /* tap hint at bottom */
    .tap-hint {
      position: absolute;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-family: 'Russo One', 'Georgia', serif;
      font-size: clamp(11px, 2.5vw, 15px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(255,80,0,0.6);
      animation: fadeInUp 0.8s ease 1.8s both, pulse 2.4s ease-in-out 2.6s infinite;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ===== KEYFRAMES ===== */
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.85); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    @keyframes flamePulse {
      0%, 100% { filter: drop-shadow(0 4px 18px rgba(255,60,0,0.7)); }
      50%       { filter: drop-shadow(0 4px 36px rgba(255,120,0,1)); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(14px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
  </style>
</head>
<body>

  <div id="splash">

    <!-- Ninja-style PLAY button -->
    <div class="play-btn-wrap" id="playBtn">
      <div class="deco-line">
        <span></span>
        <i>✦ &nbsp; Press to Enter &nbsp; ✦</i>
        <span></span>
      </div>

      <div class="play-btn">Play</div>

      <div class="deco-line">
        <span></span>
        <i>✦ &nbsp; Your Battle Awaits &nbsp; ✦</i>
        <span></span>
      </div>
    </div>

    <p class="tap-hint">▶ &nbsp; TAP TO BEGIN &nbsp; ◀</p>
  </div>

  
<script>
  const splash = document.getElementById('splash');
  const playBtn = document.getElementById('playBtn');

  function openGame() {
    splash.classList.add('tapped');
    setTimeout(() => {
      window.location.href = 'game.html';
    }, 160);
  }

  function enterFullscreen() {
    const el = document.documentElement;

    if (document.fullscreenElement) return;

    if (el.requestFullscreen) {
      el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
  }

  // Sentuh area selain tombol PLAY = fullscreen saja
  splash.addEventListener('touchstart', function(e) {
    if (!playBtn.contains(e.target)) {
      enterFullscreen();
    }
  }, { passive: true });

  splash.addEventListener('click', function(e) {
    if (!playBtn.contains(e.target)) {
      enterFullscreen();
    }
  });

  // Hanya tombol PLAY yang masuk game
  playBtn.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    openGame();
  }, { passive: true });

  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    openGame();
  });
</script>
</body>
</html>
